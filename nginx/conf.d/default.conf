server {
    listen 80 default_server;
    server_name _;

    set $frontend_upstream 127.0.0.1:8080;
    set $backend_upstream 127.0.0.1:3000;

    location / {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://$backend_upstream/ws$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Camera <-> station WebRTC signaling (live view) and the recording
    # ingest transport (camera-recording-nvr) both upgrade here — without
    # these locations either request falls through to `location /` and is
    # proxied to the frontend, which cannot answer a WS handshake.
    # proxy_read_timeout/proxy_send_timeout are raised well past nginx's 60s
    # default: a continuous recording's WS session is meant to survive for as
    # long as the camera stays connected, not just for one HTTP-style request.
    location /media/signaling {
        proxy_pass http://$backend_upstream/media/signaling$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location /media/recording {
        proxy_pass http://$backend_upstream/media/recording$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location /firmware/ {
        alias /firmware-cache/;
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
    }
}